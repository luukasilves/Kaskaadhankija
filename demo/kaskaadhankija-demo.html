<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="Tööseisundis näidis kaskaad-minihanke protsessist raamlepingu „Eesti.ai koolitajate tellimine“ alusel." />
<title>Kaskaadhankija — kaskaad-minihanke näidis</title>
<style>
/* Kaskaadhankija demo — self-contained styles, inlined into the single HTML file. */

:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-alt: #f9fafc;
  --border: #dde3ea;
  --border-strong: #c3ccd7;
  --text: #1b2430;
  --muted: #5d6875;
  --primary: #14507d;
  --primary-hover: #0f3f63;
  --primary-soft: #e7f0f7;
  --success: #1a6f47;
  --success-soft: #e3f3ea;
  --warning: #96560a;
  --warning-soft: #fbeedc;
  --danger: #a52a21;
  --danger-soft: #fbe8e6;
  --info: #14507d;
  --info-soft: #e7f0f7;
  --neutral: #5d6875;
  --neutral-soft: #eef1f5;
  --demo: #7a3ea3;
  --demo-soft: #f3e9fa;
  --shadow: 0 1px 2px rgba(20, 36, 54, 0.06), 0 4px 12px rgba(20, 36, 54, 0.05);
  --radius: 10px;
  --radius-sm: 6px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #10151c;
    --surface: #171e27;
    --surface-alt: #1d2531;
    --border: #2b3542;
    --border-strong: #3b4757;
    --text: #e7ecf2;
    --muted: #9aa6b4;
    --primary: #6aa9d8;
    --primary-hover: #8bbde4;
    --primary-soft: #1a2b3a;
    --success: #6cc79b;
    --success-soft: #16301f;
    --warning: #e0a763;
    --warning-soft: #33260f;
    --danger: #ef8177;
    --danger-soft: #35191a;
    --info: #6aa9d8;
    --info-soft: #1a2b3a;
    --neutral: #9aa6b4;
    --neutral-soft: #222b37;
    --demo: #c295e0;
    --demo-soft: #2a1c36;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 4px 14px rgba(0, 0, 0, 0.3);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h1 { font-size: 21px; }
h2 { font-size: 16px; }
h3 { font-size: 14px; }
p { margin: 0 0 10px; }
a { color: var(--primary); }

/* ---------------- top bar ---------------- */

.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 40;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
}

.demo-badge {
  background: var(--demo-soft);
  color: var(--demo);
  border: 1px solid currentColor;
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
}

.topbar-spacer { flex: 1 1 auto; }

.clock {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 5px 10px;
}

.clock-label { color: var(--muted); font-size: 12px; }
.clock-value { font-variant-numeric: tabular-nums; font-weight: 650; }

/* ---------------- layout ---------------- */

.layout {
  display: grid;
  grid-template-columns: 200px minmax(0, 1fr);
  align-items: start;
  gap: 0;
}

.layout.with-mailbox { grid-template-columns: 200px minmax(0, 1fr) 380px; }

.sidenav {
  padding: 16px 12px;
  border-right: 1px solid var(--border);
  position: sticky;
  top: 57px;
  align-self: start;
}

.sidenav a {
  display: block;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  color: var(--text);
  text-decoration: none;
  font-weight: 550;
  cursor: pointer;
}
.sidenav a:hover { background: var(--surface-alt); }
.sidenav a.active { background: var(--primary-soft); color: var(--primary); }
.sidenav .nav-count { float: right; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }

main { padding: 22px 24px 60px; min-width: 0; }

.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.page-head .subtitle { color: var(--muted); margin: 3px 0 0; }

/* ---------------- cards ---------------- */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.card-head {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.card-body { padding: 16px; }
.card-body.tight { padding: 0; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 13px 15px;
  box-shadow: var(--shadow);
}
.stat-value { font-size: 25px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat-label { color: var(--muted); font-size: 12px; margin-top: 2px; }

.intro {
  background: var(--primary-soft);
  border: 1px solid var(--primary);
  border-radius: var(--radius);
  padding: 15px 17px;
  margin-bottom: 18px;
}
.intro h2 { margin-bottom: 7px; }
.intro ol { margin: 8px 0 0; padding-left: 20px; }
.intro li { margin-bottom: 4px; }

/* ---------------- tables ---------------- */

table { width: 100%; border-collapse: collapse; }
.table-wrap { overflow-x: auto; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 650; white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-alt); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.nowrap, th.nowrap { white-space: nowrap; }

.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.mono { font-variant-numeric: tabular-nums; }
.strong { font-weight: 650; }

/* ---------------- badges + buttons ---------------- */

.badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
}
.badge-neutral { background: var(--neutral-soft); color: var(--neutral); }
.badge-info { background: var(--info-soft); color: var(--info); }
.badge-success { background: var(--success-soft); color: var(--success); }
.badge-warning { background: var(--warning-soft); color: var(--warning); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }

.rank-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: 6px;
  background: var(--neutral-soft);
  color: var(--text);
  font-weight: 700;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

button, .btn {
  font: inherit;
  font-weight: 600;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  padding: 6px 13px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover, .btn:hover { background: var(--surface-alt); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
button.primary:hover { background: var(--primary-hover); }
button.success { background: var(--success); border-color: var(--success); color: #fff; }
button.danger { background: var(--surface); border-color: var(--danger); color: var(--danger); }
button.danger:hover { background: var(--danger-soft); }
button.small { padding: 3px 9px; font-size: 12.5px; }
button.link { border: none; background: none; color: var(--primary); padding: 0; text-decoration: underline; }

.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------------- forms ---------------- */

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
label { font-weight: 600; font-size: 12.5px; }
input, select, textarea {
  font: inherit;
  padding: 7px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  width: 100%;
  min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
textarea { resize: vertical; min-height: 66px; }
.hint { color: var(--muted); font-size: 12px; }
.error-text { color: var(--danger); font-weight: 600; }

/* ---------------- cascade timeline ---------------- */

.timeline { list-style: none; margin: 0; padding: 0; }
.timeline-item {
  position: relative;
  padding: 0 0 18px 30px;
  border-left: 2px solid var(--border);
  margin-left: 9px;
}
.timeline-item:last-child { border-left-color: transparent; padding-bottom: 0; }
.timeline-dot {
  position: absolute;
  left: -9px;
  top: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 3px solid var(--surface);
  background: var(--neutral);
}
.timeline-dot.info { background: var(--info); }
.timeline-dot.success { background: var(--success); }
.timeline-dot.warning { background: var(--warning); }
.timeline-dot.danger { background: var(--danger); }
.timeline-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.timeline-meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.timeline-note {
  margin-top: 6px;
  padding: 7px 11px;
  background: var(--surface-alt);
  border-left: 3px solid var(--border-strong);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 13px;
}
.run-divider {
  margin: 4px 0 14px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ---------------- mailbox ---------------- */

.mailbox {
  border-left: 1px solid var(--border);
  background: var(--surface-alt);
  padding: 16px 14px 60px;
  position: sticky;
  top: 57px;
  align-self: start;
  max-height: calc(100vh - 57px);
  overflow-y: auto;
}
.mailbox-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
.mailbox-hint { color: var(--muted); font-size: 12px; margin-bottom: 12px; }

.mail {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}
.mail.actionable { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
.mail-head { padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
.mail-to { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.mail-subject { font-weight: 650; margin-top: 2px; font-size: 13px; }
.mail-body { padding: 12px; font-size: 13px; border-top: 1px solid var(--border); background: var(--surface); }
.mail-body :where(p, table) { max-width: 100%; }
.mail-actions { padding: 10px 12px; background: var(--primary-soft); display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------------- modal ---------------- */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 32, 0.55);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 16px;
  overflow-y: auto;
  z-index: 100;
}
.modal {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  width: 100%;
  max-width: 640px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
}
.modal-head { padding: 15px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.modal-body { padding: 18px; }
.modal-foot { padding: 13px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* the simulated partner-facing offer page */
.offer-page { max-width: 560px; }
.offer-page .offer-banner {
  background: var(--demo-soft);
  color: var(--demo);
  padding: 8px 18px;
  font-size: 12px;
  font-weight: 650;
  border-bottom: 1px solid var(--border);
}
.detail-list { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 0; }
.detail-list dt { color: var(--muted); }
.detail-list dd { margin: 0; font-weight: 600; }

.radio-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.radio-row input { width: auto; margin-top: 4px; }
.radio-row label { font-weight: 500; }

.empty { padding: 26px 16px; text-align: center; color: var(--muted); }

.warning-banner {
  background: var(--warning-soft);
  border: 1px solid var(--warning);
  color: var(--warning);
  border-radius: var(--radius);
  padding: 11px 14px;
  margin-bottom: 14px;
  font-weight: 600;
}
.danger-banner {
  background: var(--danger-soft);
  border: 1px solid var(--danger);
  color: var(--danger);
  border-radius: var(--radius);
  padding: 11px 14px;
  margin-bottom: 14px;
  font-weight: 600;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: var(--radius);
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  max-width: min(560px, calc(100vw - 32px));
}

.footnote {
  color: var(--muted);
  font-size: 12px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
  margin-top: 26px;
}

@media (max-width: 1180px) {
  .layout.with-mailbox { grid-template-columns: 200px minmax(0, 1fr); }
  .mailbox {
    grid-column: 1 / -1;
    position: static;
    max-height: none;
    border-left: none;
    border-top: 1px solid var(--border);
  }
}

@media (max-width: 760px) {
  .layout, .layout.with-mailbox { grid-template-columns: 1fr; }
  .sidenav {
    position: static;
    border-right: none;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 8px;
  }
  .sidenav a { white-space: nowrap; }
  .sidenav .nav-count { display: none; }
  main { padding: 16px 14px 50px; }
}

</style>
</head>
